name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint notebook source files
        run: flake8 notebooks/ --count --statistics

  validate-bundle:
    name: Validate Databricks bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check secrets and configure CLI
        id: secrets
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice::DATABRICKS_HOST or DATABRICKS_TOKEN not set — skipping bundle validation"
          else
            echo "available=true" >> $GITHUB_OUTPUT
            echo "[DEFAULT]" > ~/.databrickscfg
            echo "host = $DATABRICKS_HOST" >> ~/.databrickscfg
            echo "token = $DATABRICKS_TOKEN" >> ~/.databrickscfg
          fi

      - name: Validate bundle
        if: steps.secrets.outputs.available == 'true'
        run: databricks bundle validate
