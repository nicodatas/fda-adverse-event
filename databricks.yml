bundle:
  name: fda-adverse-event

variables:
  job_name:
    default: "FDA Adverse Event Medallion Pipeline"

resources:
  jobs:
    fda_pipeline_job:
      name: ${var.job_name}
      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: /notebooks/01_bronze_ingest
          description: "Fetch raw adverse event reports from openFDA API"

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: /notebooks/02_silver_transform
          description: "Transform into 3 silver Delta tables with quality gates and MERGE"

        - task_key: gold_aggregate
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: /notebooks/03_gold_aggregate
          description: "Build aggregated gold tables and apply UC comments"

      schedule:
        quartz_cron_expression: "0 0 6 ? * *"
        timezone_id: UTC
        pause_status: UNPAUSED