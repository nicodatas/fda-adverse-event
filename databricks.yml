bundle:
  name: fda-adverse-event

variables:
  job_name:
    default: "FDA Adverse Event Medallion Pipeline"

resources:
  jobs:
    fda_pipeline_job:
      name: ${var.job_name}
      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: notebooks/01_bronze_ingest.py
          description: "Fetch raw adverse event reports from openFDA API"

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: notebooks/02_silver_transform.py
          description: "Validate raw records, then transform into 3 silver Delta tables with version-aware MERGE"
          max_retries: 2
          min_retry_interval_millis: 30000

        - task_key: gold_aggregate
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: notebooks/03_gold_aggregate.py
          description: "Build aggregated gold tables and apply UC comments"

      schedule:
        quartz_cron_expression: "0 0 6 ? * *"
        timezone_id: UTC
        pause_status: UNPAUSED